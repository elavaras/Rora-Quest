name: Deploy to Azure Container Apps

on:
  workflow_run:
    workflows: ["Build and Push Images"]
    types: [completed]
    branches: [main]

env:
  RESOURCE_GROUP: Rora-Quest
  ACR_SERVER: roraquestacr.azurecr.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy API Container App
        run: |
          az containerapp update \
            --name rora-quest-api \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_SERVER/rora-quest-api:${{ github.event.workflow_run.head_sha }}"

      - name: Deploy Web Container App
        run: |
          az containerapp update \
            --name rora-quest-web \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_SERVER/rora-quest-web:${{ github.event.workflow_run.head_sha }}"

      - name: Verify API health
        run: |
          echo "Waiting 30s for container to stabilise..."
          sleep 30
          API_URL=$(az containerapp show \
            -n rora-quest-api \
            -g "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "API FQDN: $API_URL"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$API_URL/health" || true)
            echo "Attempt $i — HTTP $STATUS"
            [ "$STATUS" = "200" ] && echo "Health check passed" && exit 0
            sleep 15
          done
          echo "Health check failed after 5 attempts — fetching container logs for diagnosis:"
          az containerapp logs show \
            -n rora-quest-api \
            -g "$RESOURCE_GROUP" \
            --tail 50 || true
          exit 1
