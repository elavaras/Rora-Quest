name: Deploy to Azure Container Apps

on:
  workflow_run:
    workflows: ["Build and Push Images"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy API Container App
        run: |
          az containerapp update \
            --name rora-quest-api \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/rora-quest-api:${{ github.event.workflow_run.head_sha }}

      - name: Deploy Web Container App
        run: |
          az containerapp update \
            --name rora-quest-web \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/rora-quest-web:${{ github.event.workflow_run.head_sha }}

      - name: Verify API health
        run: |
          API_URL=$(az containerapp show \
            -n rora-quest-api \
            -g ${{ vars.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "API FQDN: $API_URL"
          curl -sf "https://$API_URL/health" || (echo "Health check failed" && exit 1)
