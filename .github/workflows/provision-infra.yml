name: Provision Azure Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm infrastructure provisioning'
        required: true
        default: 'no'

jobs:
  provision:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'yes' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create resource group
        run: |
          az group create \
            --name Rora-Quest \
            --location canadacentral

      - name: Deploy Bicep infrastructure
        run: |
          az deployment group create \
            --resource-group Rora-Quest \
            --template-file rora-quest/infra/aca/main.bicep \
            --parameters @rora-quest/infra/aca/main.parameters.json \
            --parameters acrUsername="${{ secrets.ACR_USERNAME }}" acrPassword="${{ secrets.ACR_PASSWORD }}" \
            --verbose

      - name: Show deployment outputs
        run: |
          az deployment group show \
            --resource-group Rora-Quest \
            --name main \
            --query properties.outputs \
            -o table
