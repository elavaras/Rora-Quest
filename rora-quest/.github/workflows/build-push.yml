name: Build and Push Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
  API_IMAGE: rora-quest-api
  WEB_IMAGE: rora-quest-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push API image
        run: |
          docker build \
            -f rora-quest/infra/docker/Dockerfile.api \
            -t ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:latest \
            rora-quest
          docker push ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:latest

      - name: Build and push Web image
        run: |
          docker build \
            -f rora-quest/infra/docker/Dockerfile.web \
            -t ${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}:latest \
            rora-quest
          docker push ${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}:latest

      - name: Output image tags
        run: |
          echo "API image: ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:${{ github.sha }}"
          echo "Web image: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}:${{ github.sha }}"
