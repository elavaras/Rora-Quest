name: Deploy to Azure Container Apps

on:
  workflow_run:
    workflows: ["Build and Push Images"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy API Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          containerAppName: rora-quest-api
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/rora-quest-api:${{ github.event.workflow_run.head_sha }}
          acrName: ${{ vars.ACR_NAME }}
          acrUsername: ${{ secrets.ACR_USERNAME }}
          acrPassword: ${{ secrets.ACR_PASSWORD }}

      - name: Deploy Web Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          containerAppName: rora-quest-web
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/rora-quest-web:${{ github.event.workflow_run.head_sha }}
          acrName: ${{ vars.ACR_NAME }}
          acrUsername: ${{ secrets.ACR_USERNAME }}
          acrPassword: ${{ secrets.ACR_PASSWORD }}

      - name: Verify API health
        run: |
          API_URL=$(az containerapp show \
            -n rora-quest-api \
            -g ${{ vars.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "API FQDN: $API_URL"
          curl -sf "https://$API_URL/health" || (echo "Health check failed" && exit 1)
